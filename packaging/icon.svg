<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="256" height="256">
  <!-- Omarchy Music: a white note on a violet-to-cyan tile. The Android, Windows and Linux icons come from this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="108" height="108" rx="26" fill="url(#bg)"/>
  <rect width="108" height="108" rx="26" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.6">
    <circle cx="54" cy="54" r="40"/><circle cx="54" cy="54" r="32"/>
  </g>
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(2 -2.5)">
    <path d="M44 40.5 L74 33.5 V68" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M44 40.5 V73" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="36.5" cy="73.5" rx="10" ry="8" transform="rotate(-18 36.5 73.5)"/>
    <ellipse cx="66.5" cy="68.5" rx="10" ry="8" transform="rotate(-18 66.5 68.5)"/>
  </g>
</svg>
